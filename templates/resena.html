{% extends "base.html" %}
{% block titulo %}Dejar reseña - ServiHogar Durango{% endblock %}

{% block contenido %}
<section class="seccion contenedor-formulario">
    <h1>Dejar reseña</h1>
    <p>Servicio: <strong>{{ solicitud.servicio.nombre }}</strong> (Folio #{{ solicitud.id }})</p>

    <form action="{{ url_for('dejar_resena', id_solicitud=solicitud.id) }}" method="POST">
        <label for="calificacion">Calificación (1 a 5)</label>
        <select id="calificacion" name="calificacion" required>
            <option value="5">5 - Excelente</option>
            <option value="4">4 - Muy bueno</option>
            <option value="3">3 - Bueno</option>
            <option value="2">2 - Regular</option>
            <option value="1">1 - Malo</option>
        </select>

        <label for="comentario">Comentario</label>
        <textarea id="comentario" name="comentario" rows="4"></textarea>

        <button type="submit" class="boton boton-primario">Enviar reseña</button>
    </form>
    <p><a href="{{ url_for('portal_cliente') }}">Regresar a mi portal</a></p>
</section>
{% endblock %}
