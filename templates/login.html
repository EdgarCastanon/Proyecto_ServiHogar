{% extends "base.html" %}
{% block titulo %}Iniciar sesión - ServiHogar Durango{% endblock %}

{% block contenido %}
<section class="seccion contenedor-formulario">
    <h1>Iniciar sesión</h1>
    <form action="{{ url_for('login') }}" method="POST">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required autofocus>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="boton boton-primario">Entrar</button>
    </form>
    <p>¿Aún no tienes cuenta? <a href="{{ url_for('cotizar') }}">Solicita una cotización</a> para crearla automáticamente.</p>
</section>
{% endblock %}
