{% extends "base.html" %}
{% block titulo %}Cambiar contraseña - ServiHogar Durango{% endblock %}

{% block contenido %}
<section class="seccion contenedor-formulario">
    <h1>Cambiar mi contraseña</h1>
    <form action="{{ url_for('cambiar_password') }}" method="POST">
        <label for="actual">Contraseña actual</label>
        <input type="password" id="actual" name="actual" required>

        <label for="nueva">Nueva contraseña</label>
        <input type="password" id="nueva" name="nueva" required>

        <label for="confirmar">Confirmar nueva contraseña</label>
        <input type="password" id="confirmar" name="confirmar" required>

        <button type="submit" class="boton boton-primario">Guardar cambios</button>
    </form>
    <p><a href="{{ url_for('portal_cliente') }}">Regresar a mi portal</a></p>
</section>
{% endblock %}
